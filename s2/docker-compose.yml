version: '3.8'

services:
  primary:
    image: postgres:16
    container_name: primary
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: rep_db
    ports:
      - "5433:5432"

  replica1:
    image: postgres:16
    container_name: replica1
    environment:
      PGPASSWORD: pass # Пароль для pg_basebackup
    # Команда выполняет пункты 5-7 из вашей методички: очистка, бекап и запуск
    command: >
      bash -c "
      rm -rf /var/lib/postgresql/data/* &&
      pg_basebackup -h primary -D /var/lib/postgresql/data -U replicator -P -R &&
      docker-entrypoint.sh postgres"
    ports:
      - "5434:5432"

  replica2:
    image: postgres:16
    container_name: replica2
    environment:
      PGPASSWORD: pass
    command: >
      bash -c "
      rm -rf /var/lib/postgresql/data/* &&
      pg_basebackup -h primary -D /var/lib/postgresql/data -U replicator -P -R &&
      docker-entrypoint.sh postgres"
    ports:
      - "5435:5432"
