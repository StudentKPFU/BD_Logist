
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
    
  python-app:
    image: python:3.11-slim
    container_name: python-runner
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python script.py"
    depends_on:
      - qdrant
